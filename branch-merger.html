<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch Merger</title>
<!--
  Pick branches, press Apply: a brand-new branch is created from the base branch and
  every selected branch is merged into it, in the listed order, through the GitHub API.

  Open this file directly in the browser (file://). Settings, the selection and the
  history of applies are kept in this browser's localStorage, token included: use a
  fine-grained token limited to this repository with "Contents: Read and write".
  The token is only ever sent to api.github.com.

  Local branches: run `python3 main.py` and open http://127.0.0.1:8765 instead.
  Settings > Source then offers "Local clone", which takes the repository folder: the
  list shows your local branches and origin's, and Apply merges with git in a temporary
  worktree (your checkout is not touched). The new branch stays local unless "Push to
  origin" (next to Apply, off on every page load) is ticked: then it is pushed once every
  merge succeeded.
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --border: #d9dde4;
    --accent: #2f6fde; --accent-text: #fff; --ok: #1a7f4b; --warn: #a15c00; --err: #c2352b;
    --row-hover: #f0f3f8; --code: #eef1f5;
    --ours-bg: #e3edff; --theirs-bg: #ffeedd; --base-bg: #e9ebef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #98a2b3; --border: #2e3542;
      --accent: #5b8ff0; --accent-text: #0d1117; --ok: #4cc38a; --warn: #f0a742; --err: #f07167;
      --row-hover: #222936; --code: #232a36;
      --ours-bg: #1a2a45; --theirs-bg: #3a2a15; --base-bg: #2a303b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit;
  }
  button {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--row-hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.icon { padding: 2px 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .list { border: 1px solid var(--border); border-radius: 6px; max-height: 245px; overflow: auto; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--row-hover); }
  .item label { margin: 0; font-size: 14px; color: var(--text); display: flex; gap: 8px; align-items: center; flex: 1; cursor: pointer; word-break: break-all; }
  .item.disabled label { color: var(--muted); cursor: default; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.ok { color: var(--ok); border-color: var(--ok); }
  #selectedList .item { cursor: grab; }
  #selectedList .item.dragging { opacity: .4; }
  #selectedList .item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  #selectedList .item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .grip {
    padding: 0 2px; border: 0; background: none; color: var(--muted); cursor: grab;
    font: 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -3px;
  }
  .grip:hover:not(:disabled) { background: none; color: var(--text); }
  .grip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .tag.err { color: var(--err); border-color: var(--err); }
  .ab { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; color: var(--muted); }
  .ab .ahead { color: var(--ok); }
  .ab .behind.far { color: var(--warn); }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .log { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 6px; padding: 10px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .empty { padding: 14px; color: var(--muted); text-align: center; }
  details summary { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  a { color: var(--accent); }
  button.tag { background: none; cursor: pointer; line-height: inherit; }
  #drySummary.clickable { cursor: pointer; text-decoration: underline dotted; }
  #conflictFiles details { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; }
  #conflictFiles summary { display: flex; gap: 8px; align-items: center; list-style: none; user-select: none; }
  #conflictFiles summary::-webkit-details-marker { display: none; }
  /* flex hides the native disclosure triangle: draw our own */
  #conflictFiles summary::before { content: '▸'; color: var(--muted); width: 10px; flex: none; }
  #conflictFiles details[open] > summary::before { content: '▾'; }
  #conflictFiles summary:hover::before { color: var(--text); }
  .note { font-size: 12.5px; color: var(--warn); margin-top: 6px; }
  .hunk { font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 6px; margin-top: 8px; overflow-x: auto; }
  .hunk-rows { display: inline-block; min-width: 100%; padding: 4px 0; }
  .hl { display: flex; white-space: pre; padding-right: 10px; }
  .hl .ln { flex: none; width: 52px; padding-right: 10px; text-align: right; color: var(--muted); user-select: none; }
  .hl.ours, .hl.m-ours { background: var(--ours-bg); }
  .hl.theirs, .hl.m-theirs { background: var(--theirs-bg); }
  .hl.base, .hl.m-base { background: var(--base-bg); }
  .hl.m-ours, .hl.m-base, .hl.m-sep, .hl.m-theirs { color: var(--muted); font-weight: 600; }
  .legend { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 3px 0 10px; }
</style>
</head>
<body>
<main>
  <h1>Branch Merger</h1>
  <p class="sub">Select branches, press <b>Apply</b>: a new branch is cut from the base branch and the selected branches are merged into it, in order.</p>

  <section class="panel">
    <details id="settingsBox">
      <summary><b>Settings</b> <span class="muted" id="settingsSummary"></span></summary>
      <div class="grid" style="margin-top:12px">
        <div id="sourceBox" hidden>
          <label for="source">Source</label>
          <select id="source">
            <option value="local">Local clone (git, local branches included)</option>
            <option value="github">GitHub (remote branches only)</option>
          </select>
        </div>
        <div class="local-only"><label for="localPath">Repository folder</label><input id="localPath" type="text" spellcheck="false" placeholder="/path/to/your/clone"></div>
        <div class="github-only"><label for="owner">Owner</label><input id="owner" type="text"></div>
        <div class="github-only"><label for="repo">Repository</label><input id="repo" type="text"></div>
        <div class="github-only"><label for="token">GitHub token (stored in this browser)</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"></div>
        <div><label for="prefix">New branch prefix</label><input id="prefix" type="text"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <label style="margin:0"><input id="deleteOnFail" type="checkbox"> Delete the new branch when a merge conflicts</label>
        <span class="spacer"></span>
        <button id="forgetToken" class="github-only">Forget token</button>
      </div>
    </details>
  </section>

  <div class="cols">
    <section class="panel">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">Branches</h2>
        <span class="muted" id="branchCount"></span>
        <span class="spacer"></span>
        <button id="reload">Reload</button>
      </div>
      <div class="row" style="margin-bottom:10px">
        <input id="filter" type="text" placeholder="Filter, e.g. ODS-3821" style="flex:1">
        <label style="margin:0;white-space:nowrap"><input id="hideArchived" type="checkbox"> Hide archived/*</label>
      </div>
      <div class="list" id="branchList"><div class="empty">Add a token in Settings, then Reload.</div></div>
    </section>

    <section class="panel">
      <h2>Selected <span class="muted" style="font-weight:400">(merge order)</span></h2>
      <div class="list" id="selectedList"></div>
      <div class="row" style="margin-top:8px">
        <button id="clearSel">Clear</button>
        <span class="spacer"></span>
        <span id="drySummary" class="muted" style="font-size:12.5px"></span>
      </div>

      <div style="margin-top:16px">
        <label for="base">Base branch (the new branch starts here)</label>
        <select id="base"></select>
      </div>
      <div style="margin-top:10px">
        <label for="newName">New branch name</label>
        <div class="row">
          <input id="newName" type="text" style="flex:1">
          <button id="renew" class="icon" title="New timestamped name">↻</button>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <span class="spacer"></span>
        <label id="pushBox" hidden style="margin:0;font-size:14px;color:var(--text);white-space:nowrap" title="After all merges succeed, push the new branch to origin (git push --set-upstream). Off by default on every page load.">
          <input id="pushNew" type="checkbox"> Push to origin
        </label>
        <button id="apply" class="primary">Apply</button>
      </div>
    </section>
  </div>

  <section class="panel" id="conflictBox" hidden>
    <div class="row" style="margin-bottom:6px">
      <h2 style="margin:0;word-break:break-all" id="conflictTitle">Conflicts</h2>
      <span class="spacer"></span>
      <button id="expandConflicts" class="icon" title="Expand every file">Expand all</button>
      <button id="collapseConflicts" class="icon" title="Collapse every file">Collapse all</button>
      <button id="closeConflicts" class="icon" title="Close">×</button>
    </div>
    <p class="muted" id="conflictSub" style="margin:0 0 10px"></p>
    <div id="conflictFiles"></div>
  </section>

  <section class="panel" id="runBox" hidden>
    <h2>Run</h2>
    <div class="log" id="log"></div>
    <div class="row" id="runLinks" style="margin-top:10px"></div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:10px">
      <h2 style="margin:0">History</h2>
      <span class="spacer"></span>
      <button id="clearHistory">Clear history</button>
    </div>
    <div id="history"></div>
  </section>
</main>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- storage

  const KEY = 'branchMerger.v1';
  const DEFAULTS = {
    owner: 'OneDataSource',
    repo: 'oneVIEW-Admin',
    token: '',
    prefix: 'integration/',
    source: 'local',
    localPath: '',
    base: 'master',
    selected: [],
    hideArchived: true,
    deleteOnFail: true,
    history: [],
  };
  // branches that must never be the new branch
  const PROTECTED = /^(master|main|staging|development|release\/.*|hotfix\/.*)$/;
  const HISTORY_LIMIT = 30;

  function load() {
    try {
      return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || '{}') };
    } catch {
      return { ...DEFAULTS };
    }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      console.warn('Could not save to localStorage', e);
    }
  }

  const state = load();
  let branches = [];   // every branch name from the last reload (base options, existence checks)
  let shas = {};       // branch name -> tip sha, from the last reload
  let meta = {};       // local mode: branch name -> { kind, remote, shadowed } from the helper
  let running = false;

  // Served by branch-merger-local.py (not opened as a file): the local clone can be used.
  const HELPER = /^https?:$/.test(location.protocol) && ['127.0.0.1', 'localhost'].includes(location.hostname);
  const isLocal = () => HELPER && state.source === 'local';
  const ready = () => Boolean(isLocal() ? state.localPath : state.token);
  const notReadyText = () => (isLocal() ? 'Enter the repository folder in Settings, then Reload.' : 'Add a token in Settings, then Reload.');
  const ARCHIVED = /^(origin\/)?archived\//;
  // branches shown with a checkbox: in local mode, origin/x is hidden when a local x exists
  const listed = () => branches.filter((n) => !meta[n]?.shadowed);

  // ahead/behind of a branch against the base, keyed by "<base sha>...<head sha>".
  // A pair of commits always compares the same, so the cache never goes stale;
  // it is kept across reloads and trimmed to the newest entries.
  const COMPARE_KEY = 'branchMerger.compare.v1';
  const COMPARE_LIMIT = 1000;
  // a branch this many commits behind the base is shown in the warning color
  const FAR_BEHIND = 50;
  let compares = (() => {
    try { return JSON.parse(localStorage.getItem(COMPARE_KEY) || '{}'); } catch { return {}; }
  })();
  function saveCompares() {
    const keys = Object.keys(compares);
    if (keys.length > COMPARE_LIMIT) {
      compares = Object.fromEntries(keys.slice(-COMPARE_LIMIT).map((k) => [k, compares[k]]));
    }
    try { localStorage.setItem(COMPARE_KEY, JSON.stringify(compares)); } catch { /* cache only */ }
  }

  // ---------------------------------------------------------------- dom helpers

  const $ = (id) => document.getElementById(id);
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') node.className = v;
      else if (k === 'dataset') Object.assign(node.dataset, v);
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) node[k] = v;
    }
    for (const child of children.flat()) {
      if (child !== null && child !== undefined) node.append(child);
    }
    return node;
  }
  const repoUrl = () => `https://github.com/${state.owner}/${state.repo}`;
  const branchUrl = (name) => `${repoUrl()}/tree/${name.split('/').map(encodeURIComponent).join('/')}`;
  const refPath = (name) => name.split('/').map(encodeURIComponent).join('/');

  function stamp(date = new Date()) {
    const p = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}${p(date.getMonth() + 1)}${p(date.getDate())}-${p(date.getHours())}${p(date.getMinutes())}`;
  }

  // ---------------------------------------------------------------- github api

  async function gh(path, { method = 'GET', body } = {}) {
    const res = await fetch(`https://api.github.com/repos/${state.owner}/${state.repo}${path}`, {
      method,
      headers: {
        Accept: 'application/vnd.github+json',
        Authorization: `Bearer ${state.token}`,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    if (res.status !== 204) {
      try { data = await res.json(); } catch { data = null; }
    }
    return { status: res.status, data };
  }

  // ---------------------------------------------------------------- local helper api

  async function helper(path, { method = 'GET', body } = {}) {
    const res = await fetch(`/api${path}`, {
      method,
      headers: {
        'X-Branch-Merger': '1',
        // header values must be ASCII: the helper decodes it
        'X-Branch-Merger-Repo': encodeURIComponent(state.localPath),
        ...(body ? { 'Content-Type': 'application/json' } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch { data = null; }
    if (res.status === 404) {
      // The page is read from disk on every request, the helper's routes only at start:
      // an endpoint added since the helper started is missing until it is restarted.
      data = { error: 'The running helper is older than this page: stop main.py (Ctrl+C) and start it again.' };
    }
    return { status: res.status, data };
  }

  /** Local and origin branches as { name: tipSha }, after fetching origin. */
  async function listLocalBranches() {
    const fetched = await helper('/fetch', { method: 'POST' });
    if (fetched.status !== 200) console.warn('git fetch failed, listing what is already known', fetched.data);
    const { status, data } = await helper('/branches');
    if (status !== 200) throw new Error(`Listing branches failed (${status}): ${data?.error || ''}`);
    meta = Object.fromEntries(data.branches.map((b) => [b.name, b]));
    return Object.fromEntries(data.branches.map((b) => [b.name, b.sha]));
  }

  // ---------------------------------------------------------------- dry run (local mode)

  // Result of merging the selection into the base in memory, in order, keyed by what was
  // checked (base + selected branches and their tips): a reorder or a new tip re-checks.
  let dry = { key: null, pending: false, results: {}, error: null };
  let dryRun = 0;
  let dryTimer = null;

  const dryKey = () => JSON.stringify([state.base, shas[state.base], state.selected.map((n) => [n, shas[n]])]);

  function scheduleDryRun() {
    if (!isLocal() || !state.selected.length || !state.base || !branches.length) {
      dry = { key: null, pending: false, results: {}, error: null };
      return;
    }
    const key = dryKey();
    if (key === dry.key) return;
    dry = { key, pending: true, results: {}, error: null };
    clearTimeout(dryTimer);
    dryTimer = setTimeout(() => runDryRun(key), 300);
  }

  async function runDryRun(key) {
    const run = ++dryRun;
    let next;
    try {
      const { status, data } = await helper('/dry-run', { method: 'POST', body: { base: state.base, branches: state.selected } });
      next = status === 200
        ? { key, pending: false, results: Object.fromEntries(data.results.map((r) => [r.head, r])), error: null }
        : { key, pending: false, results: {}, error: data?.error || `Dry run failed (${status})` };
    } catch (e) {
      next = { key, pending: false, results: {}, error: e.message };
    }
    if (run !== dryRun || key !== dryKey()) return; // the selection changed meanwhile
    dry = next;
    if (dragFrom === null) renderSelected(); // else shown when the drag ends
  }

  /** Badge for a selected branch: would it merge cleanly at its position? */
  function dryBadge(name, i) {
    if (!isLocal() || !dry.key) return null;
    if (dry.pending) return el('span', { class: 'ab', title: 'Dry run…' }, '…');
    const r = dry.results[name];
    if (!r) return null;
    const after = [state.base, ...state.selected.slice(0, i)].join(' + ');
    if (r.status === 'clean') return el('span', { class: 'tag ok', title: `Merges cleanly into ${after}` }, '✓');
    if (r.status === 'contained') return el('span', { class: 'tag', title: `Already contained in ${after}: nothing to merge` }, 'in base');
    if (r.status === 'conflict') {
      return el('button', {
        class: 'tag err',
        title: `Conflicts with ${after} in:\n${r.files.join('\n')}\n\nClick to see the conflicts`,
        onclick: () => showConflicts(name),
      }, `✗ ${r.files.length} file${r.files.length === 1 ? '' : 's'}`);
    }
    return el('span', { class: 'tag warn', title: r.message || 'Could not check' }, '?');
  }

  function renderDrySummary() {
    const box = $('drySummary');
    box.className = 'muted';
    box.title = '';
    box.onclick = null;
    if (!isLocal() || !dry.key) { box.textContent = ''; return; }
    if (dry.pending) { box.textContent = 'Dry run…'; return; }
    if (dry.error) { box.className = 'err'; box.textContent = `Dry run failed: ${dry.error}`; return; }
    const conflicts = state.selected.filter((n) => dry.results[n]?.status === 'conflict');
    if (!conflicts.length) {
      box.className = 'ok';
      box.textContent = `Dry run: all ${state.selected.length} merge cleanly`;
      return;
    }
    box.className = 'err clickable';
    box.textContent = `Dry run: ${conflicts.length} conflict${conflicts.length === 1 ? '' : 's'}, Apply would stop at ${conflicts[0]}`;
    box.title = `${conflicts.map((n) => `${n}: ${dry.results[n].files.join(', ')}`).join('\n')}\n\nClick to see the conflicts`;
    box.onclick = () => showConflicts(conflicts[0]);
  }

  // ---------------------------------------------------------------- conflict view (local mode)

  // The selected branch whose dry-run conflicts are shown, if any. Each file's conflicted
  // regions are read on demand from the in-memory merge tree the dry run wrote.
  let conflictHead = null;

  function showConflicts(name) {
    conflictHead = name;
    $('conflictBox').dataset.key = '';
    renderConflicts();
    $('conflictBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function renderConflicts() {
    const box = $('conflictBox');
    if (!conflictHead || !isLocal() || !dry.key) { box.hidden = true; return; }
    // a new dry run is on its way: keep the last view, dimmed, until it lands
    box.style.opacity = dry.pending ? '.5' : '';
    if (dry.pending) return;
    const r = dry.results[conflictHead];
    if (r?.status !== 'conflict') { conflictHead = null; box.hidden = true; return; }

    const i = state.selected.indexOf(conflictHead);
    const after = [state.base, ...state.selected.slice(0, i)].join(' + ');
    box.hidden = false;
    // unrelated redraws must not collapse what is open
    const key = JSON.stringify([conflictHead, r.tree, after]);
    if (box.dataset.key === key) return;
    box.dataset.key = key;

    $('conflictTitle').textContent = `Conflicts: ${conflictHead}`;
    $('conflictSub').replaceChildren(
      `Dry run of merging it into ${after}: nothing is written. `,
      el('span', { class: 'legend', style: 'background:var(--ours-bg)' }), `ours (${after})`,
      el('span', { class: 'legend', style: 'background:var(--base-bg)' }), 'common ancestor',
      el('span', { class: 'legend', style: 'background:var(--theirs-bg)' }), `theirs (${conflictHead})`,
    );
    const files = $('conflictFiles');
    files.replaceChildren();
    if (!r.tree) {
      files.append(el('div', { class: 'err' }, 'The running helper is older than this page: stop main.py (Ctrl+C) and start it again.'));
      return;
    }
    const head = conflictHead;
    r.files.forEach((path, n) => {
      const notes = r.notes?.[path] || [];
      const kinds = [...new Set(notes.map((m) => m.match(/^CONFLICT \(([^)]+)\)/)?.[1]).filter(Boolean))];
      const body = el('div', {}, el('div', { class: 'muted' }, 'Loading…'));
      const details = el('details', {
        ontoggle: () => { if (details.open) loadHunks(r.tree, path, body, notes, { after, head }); },
      },
        el('summary', {}, el('code', {}, path), ...kinds.map((k) => el('span', { class: 'tag err' }, k))),
        body);
      files.append(details);
      if (n === 0) details.open = true;
    });
  }

  const MARKERS = {
    'm-ours': ({ after }) => `<<<<<<< ours: ${after}`,
    'm-base': () => '||||||| common ancestor',
    'm-sep': () => '=======',
    'm-theirs': ({ head }) => `>>>>>>> theirs: ${head}`,
  };

  async function loadHunks(tree, path, body, notes, labels) {
    if (body.dataset.loaded) return;
    body.dataset.loaded = '1';
    let res;
    try {
      res = await helper(`/conflict?tree=${tree}&path=${encodeURIComponent(path)}`);
    } catch (e) {
      res = { status: 0, data: { error: e.message } };
    }
    const { status, data } = res;
    body.replaceChildren(...notes.map((m) => el('div', { class: 'note' }, m)));
    if (status !== 200) {
      body.append(el('div', { class: 'err' }, data?.error || `Could not read the conflict (${status})`));
      delete body.dataset.loaded; // try again on the next open
      return;
    }
    const say = (text) => body.append(el('div', { class: 'muted', style: 'margin-top:6px' }, text));
    if (data.missing) return say('Not in the merged result (deleted on one side): see the note above.');
    if (data.binary) return say('Binary file: no line view.');
    if (!data.hunks.length) return say('No conflict markers in the file: see the note above.');
    for (const hunk of data.hunks) {
      body.append(el('div', { class: 'hunk' }, el('div', { class: 'hunk-rows' },
        hunk.map(([n, kind, text]) => el('div', { class: `hl ${kind}` },
          el('span', { class: 'ln' }, String(n)),
          el('span', {}, MARKERS[kind] ? MARKERS[kind](labels) : text))))));
    }
    if (data.truncated) say('Truncated: the file has more conflicted lines than shown.');
  }

  /** Tag for a local-mode branch: is it on origin, and in sync? */
  function localTag(name) {
    const m = meta[name];
    if (!m || m.kind !== 'local') return null;
    if (!m.remote) return el('span', { class: 'tag warn', title: 'Only on this machine, not on origin' }, 'local only');
    const { ahead, behind } = m.remote;
    if (ahead && behind) return el('span', { class: 'tag warn', title: `${ahead} commit(s) not pushed, ${behind} on origin not pulled` }, `diverged ↑${ahead} ↓${behind}`);
    if (ahead) return el('span', { class: 'tag warn', title: `${ahead} commit(s) not pushed to origin` }, `unpushed ↑${ahead}`);
    if (behind) return el('span', { class: 'tag', title: `origin has ${behind} commit(s) not in this local branch` }, `behind origin ↓${behind}`);
    return null;
  }

  /** Remote branches as { name: tipSha }. */
  async function listBranches() {
    if (isLocal()) return listLocalBranches();
    meta = {};
    const found = {};
    for (let page = 1; page < 50; page++) {
      const { status, data } = await gh(`/branches?per_page=100&page=${page}`);
      if (status !== 200) throw new Error(`Listing branches failed (${status}): ${data?.message || ''}`);
      for (const b of data) found[b.name] = b.commit.sha;
      if (data.length < 100) break;
    }
    return found;
  }

  // ---------------------------------------------------------------- ahead / behind

  const compareKey = (name) => (shas[state.base] && shas[name] ? `${shas[state.base]}...${shas[name]}` : null);

  /** Fill `span` with the ahead/behind of `name` against the base. */
  function fillAheadBehind(span, name) {
    span.replaceChildren();
    span.title = '';
    const key = name === state.base ? null : compareKey(name);
    if (!key) return;
    const c = compares[key];
    if (!c) {
      span.append('…');
      return;
    }
    if (c.error) {
      span.append('?');
      span.title = `Could not compare with ${state.base}: ${c.error}`;
      return;
    }
    if (c.ahead === 0) {
      span.append(el('span', { class: 'tag' }, 'in base'));
      span.title = `Everything on this branch is already in ${state.base} (${c.behind} behind)`;
      return;
    }
    span.append(
      el('span', { class: 'ahead' }, `↑${c.ahead}`), ' ',
      el('span', { class: `behind${c.behind >= FAR_BEHIND ? ' far' : ''}` }, `↓${c.behind}`),
    );
    span.title = `${c.ahead} commit(s) not in ${state.base}, ${c.behind} commit(s) of ${state.base} missing`;
  }

  const aheadBehind = (name) => {
    const span = el('span', { class: 'ab' });
    span.dataset.name = name;
    fillAheadBehind(span, name);
    return span;
  };

  function refreshAheadBehind(name) {
    for (const span of document.querySelectorAll('.ab')) {
      if (span.dataset.name === name) fillAheadBehind(span, name);
    }
  }

  let compareRun = 0;
  /** Fetch the missing ahead/behind counts of `names`, a few requests at a time. */
  async function loadAheadBehind(names) {
    const run = ++compareRun;
    const queue = names.filter((n) => n !== state.base && compareKey(n) && !compares[compareKey(n)]);
    const worker = async () => {
      while (queue.length && run === compareRun && ready()) {
        const name = queue.shift();
        const key = compareKey(name);
        if (!key || compares[key]) continue;
        if (isLocal()) {
          const [base, head] = key.split('...');
          const { status, data } = await helper(`/compare?base=${base}&head=${head}`);
          compares[key] = status === 200 ? data : { error: `${status} ${data?.error || ''}`.trim() };
        } else {
          // compare by sha (no escaping of branch names); per_page=1 keeps the payload small
          const { status, data } = await gh(`/compare/${key}?per_page=1`);
          compares[key] = status === 200
            ? { ahead: data.ahead_by, behind: data.behind_by }
            : { error: `${status} ${data?.message || ''}`.trim() };
        }
        refreshAheadBehind(name);
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    saveCompares();
  }

  // ---------------------------------------------------------------- rendering

  function renderSettings() {
    $('localPath').value = state.localPath;
    for (const node of document.querySelectorAll('.local-only')) node.hidden = !isLocal();
    for (const node of document.querySelectorAll('.github-only')) node.hidden = isLocal();
    $('owner').value = state.owner;
    $('repo').value = state.repo;
    $('token').value = state.token;
    $('prefix').value = state.prefix;
    $('deleteOnFail').checked = state.deleteOnFail;
    $('hideArchived').checked = state.hideArchived;
    $('sourceBox').hidden = !HELPER;
    $('source').value = state.source;
    $('settingsSummary').textContent = isLocal()
      ? `— local clone${state.localPath ? ` · ${state.localPath}` : ' · no folder'}`
      : `— ${state.owner}/${state.repo}${state.token ? '' : ' · no token'}`;
    if (!ready()) $('settingsBox').open = true;
  }

  function renderBranches() {
    const list = $('branchList');
    list.replaceChildren();
    if (!branches.length) {
      list.append(el('div', { class: 'empty' }, ready() ? 'No branches loaded. Press Reload.' : notReadyText()));
      $('branchCount').textContent = '';
      return;
    }
    const q = $('filter').value.trim().toLowerCase();
    const all = listed();
    const shown = all.filter((name) =>
      (!state.hideArchived || !ARCHIVED.test(name)) && (!q || name.toLowerCase().includes(q)));
    $('branchCount').textContent = `${shown.length} of ${all.length}`;

    if (!shown.length) {
      list.append(el('div', { class: 'empty' }, 'Nothing matches the filter.'));
      return;
    }
    for (const name of shown) {
      const isBase = name === state.base;
      const id = `b-${name}`;
      list.append(el('div', { class: `item${isBase ? ' disabled' : ''}` },
        el('label', { htmlFor: id },
          el('input', {
            type: 'checkbox', id, checked: state.selected.includes(name), disabled: isBase,
            onchange: (e) => toggle(name, e.target.checked),
          }),
          name),
        localTag(name),
        aheadBehind(name),
        isBase ? el('span', { class: 'tag' }, 'base') : null,
        PROTECTED.test(name) && !isBase ? el('span', { class: 'tag' }, 'protected') : null,
      ));
    }
    loadAheadBehind(shown);
  }

  function renderSelected() {
    const list = $('selectedList');
    // keyboard reordering: a redraw (the move itself, or a dry run landing) keeps the focus
    // on the grip of the branch that had it
    const focused = document.activeElement?.classList.contains('grip') ? document.activeElement.dataset.name : null;
    list.replaceChildren();
    if (!state.selected.length) {
      list.append(el('div', { class: 'empty' }, 'No branches selected.'));
    }
    state.selected.forEach((name, i) => {
      const missing = branches.length && !branches.includes(name);
      const row = el('div', {
        class: 'item',
        draggable: !running,
        title: 'Drag to change the merge order',
        ondragstart: (e) => dragStart(e, i),
        ondragover: (e) => dragOver(e, row),
        ondragleave: () => row.classList.remove('drop-before', 'drop-after'),
        ondrop: (e) => drop(e, i, row),
        ondragend: dragEnd,
      },
        el('button', {
          class: 'grip',
          dataset: { name },
          title: 'Drag to reorder, or focus and press ↑/↓',
          ariaLabel: `Move ${name} (position ${i + 1} of ${state.selected.length}) with the arrow keys`,
          disabled: running,
          onkeydown: (e) => gripKey(e, i),
        }, '⋮⋮'),
        el('span', { class: 'muted', style: 'width:20px' }, String(i + 1)),

        // show elipsis if name is too long
        el('span', { style: 'flex:1;' }, name.length > 48 ? name.slice(0, 48) + '...' : name),
        missing ? el('span', { class: 'tag warn', title: isLocal() ? 'No such branch in the local clone' : 'Not on the remote any more' }, 'missing') : null,
        missing ? null : dryBadge(name, i),
        el('button', { class: 'icon', title: 'Remove', onclick: () => toggle(name, false) }, '×'),
      );
      list.append(row);
    });
    if (focused) [...list.querySelectorAll('.grip')].find((g) => g.dataset.name === focused)?.focus();
    $('apply').disabled = running || !state.selected.length || !state.base || !ready();
    scheduleDryRun();
    renderDrySummary();
    renderConflicts();
    $('pushBox').hidden = !isLocal();
    $('pushNew').disabled = running;
    $('apply').textContent = isLocal() && $('pushNew').checked ? 'Apply & push' : 'Apply';
  }

  function renderBase() {
    const select = $('base');
    select.replaceChildren();
    const options = branches.length ? branches.filter((n) => !ARCHIVED.test(n)) : (state.base ? [state.base] : []);
    if (!state.base || (branches.length && !branches.includes(state.base))) {
      // default to the newest release candidate, else master; in local mode origin's
      // copy wins over a local one, which may be stale
      const bare = (n) => n.replace(/^origin\//, '');
      const releases = options
        .filter((n) => /^(origin\/)?release\/\d{8}$/.test(n))
        .sort((a, b) => bare(a).localeCompare(bare(b)) || (a.startsWith('origin/') ? 1 : -1));
      const master = ['origin/master', 'master'].find((n) => options.includes(n));
      state.base = releases.at(-1) || master || options[0] || '';
      save();
    }
    for (const name of options) {
      select.append(el('option', { value: name, selected: name === state.base }, name));
    }
  }

  function renderHistory() {
    const box = $('history');
    box.replaceChildren();
    if (!state.history.length) {
      box.append(el('div', { class: 'empty' }, 'Nothing applied yet.'));
      return;
    }
    const table = el('table', {},
      el('tr', {}, el('th', {}, 'When'), el('th', {}, 'New branch'), el('th', {}, 'Base'), el('th', {}, 'Branches'), el('th', {}, 'Result'), el('th', {}, '')));
    for (const entry of state.history) {
      table.append(el('tr', {},
        el('td', { class: 'muted' }, new Date(entry.at).toLocaleString()),
        el('td', {}, entry.ok && (entry.source !== 'local' || entry.pushed)
          ? el('a', { href: branchUrl(entry.name), target: '_blank', rel: 'noopener' }, entry.name)
          : [entry.name, entry.source === 'local' ? el('span', { class: 'tag', style: 'margin-left:6px' }, 'local') : null]),
        el('td', {}, entry.base),
        el('td', {}, entry.branches.join(', ')),
        el('td', { class: entry.ok ? 'ok' : 'err' }, entry.result),
        el('td', {}, el('button', { class: 'icon', title: 'Select these branches again', onclick: () => reuse(entry) }, 'Reuse')),
      ));
    }
    box.append(table);
  }

  function renderAll() {
    renderSettings();
    renderBase();
    renderBranches();
    renderSelected();
    renderHistory();
  }

  // ---------------------------------------------------------------- actions

  function toggle(name, on) {
    state.selected = on
      ? (state.selected.includes(name) ? state.selected : [...state.selected, name])
      : state.selected.filter((n) => n !== name);
    save();
    renderBranches();
    renderSelected();
  }

  /** Move the selected branch at `from` so it ends up at index `to`. */
  function moveTo(from, to) {
    if (from === to || to < 0 || to >= state.selected.length) return;
    const list = [...state.selected];
    const [name] = list.splice(from, 1);
    list.splice(to, 0, name);
    state.selected = list;
    save();
    renderSelected();
  }

  // Drag and drop in the Selected list. While a row is dragged the list is not re-rendered
  // (a dry-run result arriving meanwhile is shown on drop), or the drag would be lost.
  let dragFrom = null;

  function dragStart(e, i) {
    dragFrom = i;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', state.selected[i]);
    e.currentTarget.classList.add('dragging');
  }

  /** Drop above or below `row`, depending on which half of it the pointer is over. */
  const dropAfter = (e, row) => {
    const box = row.getBoundingClientRect();
    return e.clientY > box.top + box.height / 2;
  };

  function dragOver(e, row) {
    if (dragFrom === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const after = dropAfter(e, row);
    row.classList.toggle('drop-after', after);
    row.classList.toggle('drop-before', !after);
  }

  function drop(e, i, row) {
    if (dragFrom === null) return;
    e.preventDefault();
    const from = dragFrom;
    const target = i + (dropAfter(e, row) ? 1 : 0);
    dragFrom = null;
    // removing `from` first shifts the targets after it up by one
    moveTo(from, target > from ? target - 1 : target);
    if (from === target || from === target - 1) renderSelected();
  }

  function dragEnd() {
    if (dragFrom === null) return; // dropped: already re-rendered
    dragFrom = null;
    renderSelected(); // cancelled: clear the drag styles, show any dry run that arrived
  }

  function gripKey(e, i) {
    const delta = { ArrowUp: -1, ArrowDown: 1 }[e.key];
    if (!delta) return;
    e.preventDefault();
    const to = i + delta;
    if (to < 0 || to >= state.selected.length) return;
    moveTo(i, to); // renderSelected keeps the focus on this branch's grip
  }

  function reuse(entry) {
    state.selected = [...entry.branches];
    if (!branches.length || branches.includes(entry.base)) state.base = entry.base;
    save();
    renderAll();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function reload() {
    if (!ready()) {
      $('settingsBox').open = true;
      $(isLocal() ? 'localPath' : 'token').focus();
      return;
    }
    $('reload').disabled = true;
    $('branchList').replaceChildren(el('div', { class: 'empty' }, 'Loading…'));
    try {
      shas = await listBranches();
      branches = Object.keys(shas).sort((a, b) => a.localeCompare(b));
    } catch (e) {
      shas = {};
      meta = {};
      branches = [];
      $('branchList').replaceChildren(el('div', { class: 'empty err' }, e.message));
      $('reload').disabled = false;
      return;
    }
    $('reload').disabled = false;
    renderBase();
    renderBranches();
    renderSelected();
  }

  function log(text, cls = '') {
    const line = el('div', { class: cls }, text);
    $('log').append(line);
    line.scrollIntoView({ block: 'nearest' });
  }

  async function apply() {
    const name = $('newName').value.trim();
    const base = state.base;
    const selected = [...state.selected];

    if (!name) return alertInline('Enter a name for the new branch.');
    if (PROTECTED.test(name)) return alertInline(`"${name}" is a protected branch name. Pick another one.`);
    if (branches.includes(name)) return alertInline(`"${name}" already exists. Pick a new name.`);
    const missing = selected.filter((n) => branches.length && !branches.includes(n));
    if (missing.length) return alertInline(`${isLocal() ? 'Not in the local clone' : 'Not on the remote any more'}: ${missing.join(', ')}. Remove them first.`);

    running = true;
    renderSelected();
    $('runBox').hidden = false;
    $('log').replaceChildren();
    $('runLinks').replaceChildren();

    const source = isLocal() ? 'local' : 'github';
    const finish = (ok, result, pushed = false) => {
      state.history = [{ at: Date.now(), name, base, branches: selected, ok, result, source, pushed }, ...state.history].slice(0, HISTORY_LIMIT);
      save();
      running = false;
      renderSelected();
      renderHistory();
    };

    if (source === 'local') {
      try {
        const push = $('pushNew').checked;
        const { status, data } = await helper('/apply', {
          method: 'POST',
          body: { name, base, branches: selected, deleteOnFail: state.deleteOnFail, push },
        });
        if (status !== 200) throw new Error(data?.error || `Apply failed (${status})`);
        for (const line of data.log) log(line.text, line.cls);
        if (data.pushed) addLinks(name, base.replace(/^origin\//, ''));
        else if (data.created) addLocalLinks(name);
        finish(data.ok, data.result, data.pushed);
        if (data.ok) $('newName').value = state.prefix + stamp();
        await reload();
      } catch (e) {
        log(e.message, 'err');
        finish(false, e.message);
      }
      return;
    }

    try {
      log(`Base ${base}`);
      const baseRef = await gh(`/git/ref/heads/${refPath(base)}`);
      if (baseRef.status !== 200) throw new Error(`Could not read ${base} (${baseRef.status}): ${baseRef.data?.message || ''}`);
      const sha = baseRef.data.object.sha;
      log(`  at ${sha.slice(0, 8)}`, 'muted');

      const created = await gh('/git/refs', { method: 'POST', body: { ref: `refs/heads/${name}`, sha } });
      if (created.status !== 201) throw new Error(`Could not create ${name} (${created.status}): ${created.data?.message || ''}`);
      log(`Created ${name}`, 'ok');
      branches = [...branches, name].sort((a, b) => a.localeCompare(b));

      let merged = 0;
      let upToDate = 0;
      for (const [i, head] of selected.entries()) {
        const res = await gh('/merges', {
          method: 'POST',
          body: { base: name, head, commit_message: `Merge branch '${head}' into ${name}` },
        });
        if (res.status === 201) {
          merged++;
          log(`  ✓ ${head}  → ${res.data.sha.slice(0, 8)}`, 'ok');
        } else if (res.status === 204) {
          upToDate++;
          log(`  = ${head}  already contained, nothing to merge`, 'muted');
        } else {
          const why = res.status === 409
            ? `conflicts with ${[base, ...selected.slice(0, i)].join(' + ')}`
            : `${res.status}: ${res.data?.message || 'merge failed'}`;
          log(`  ✗ ${head}  ${why}`, 'err');
          if (state.deleteOnFail) {
            const del = await gh(`/git/refs/heads/${refPath(name)}`, { method: 'DELETE' });
            log(del.status === 204 ? `Deleted ${name}` : `Could not delete ${name} (${del.status})`, del.status === 204 ? 'warn' : 'err');
            if (del.status === 204) branches = branches.filter((n) => n !== name);
          } else {
            log(`${name} kept with the merges before ${head}`, 'warn');
            addLinks(name, base);
          }
          finish(false, `Conflict: ${head}`);
          renderBranches();
          return;
        }
      }

      log(`Done: ${merged} merged, ${upToDate} already contained.`, 'ok');
      addLinks(name, base);
      finish(true, `${merged} merged${upToDate ? `, ${upToDate} up to date` : ''}`);
      $('newName').value = state.prefix + stamp();
      renderBranches();
    } catch (e) {
      log(e.message, 'err');
      finish(false, e.message);
    }
  }

  function addLinks(name, base) {
    $('runLinks').append(
      el('a', { href: branchUrl(name), target: '_blank', rel: 'noopener' }, 'Open branch'),
      el('span', { class: 'muted' }, '·'),
      el('a', { href: `${repoUrl()}/compare/${refPath(base)}...${refPath(name)}`, target: '_blank', rel: 'noopener' }, `Compare with ${base}`),
      el('span', { class: 'muted' }, '·'),
      el('a', { href: `${repoUrl()}/actions/workflows/cd.fullstack.deploy.yml`, target: '_blank', rel: 'noopener' }, 'Deploy workflow'),
      el('span', { class: 'muted' }, '(branch:'), el('code', {}, name), el('span', { class: 'muted' }, ')'),
    );
  }

  function addLocalLinks(name) {
    const push = `git push -u origin ${name}:refs/heads/${name}`;
    $('runLinks').append(
      el('span', { class: 'muted' }, 'Created locally. Push it:'),
      el('code', {}, push),
      el('button', { class: 'icon', title: 'Copy the push command', onclick: () => navigator.clipboard?.writeText(push) }, 'Copy'),
      el('span', { class: 'muted' }, '· check it out with'),
      el('code', {}, `git switch ${name}`),
    );
  }

  function alertInline(message) {
    $('runBox').hidden = false;
    $('log').replaceChildren(el('div', { class: 'err' }, message));
    $('runLinks').replaceChildren();
  }

  // ---------------------------------------------------------------- wiring

  for (const id of ['localPath', 'owner', 'repo', 'token', 'prefix']) {
    $(id).addEventListener('change', (e) => {
      const changedRepo = ['localPath', 'owner', 'repo'].includes(id) && state[id] !== e.target.value.trim();
      state[id] = e.target.value.trim();
      if (id === 'prefix') $('newName').value = state.prefix + stamp();
      if (changedRepo) { branches = []; state.base = ''; }
      save();
      renderAll();
      if (changedRepo) { shas = {}; meta = {}; }
      if (((id === 'token' && state.token) || changedRepo) && ready()) reload();
    });
  }
  $('source').addEventListener('change', (e) => {
    state.source = e.target.value;
    // branch names differ between sources (origin/ prefix): start from a fresh list
    branches = [];
    shas = {};
    meta = {};
    save();
    renderAll();
    if (ready()) reload();
  });
  $('deleteOnFail').addEventListener('change', (e) => { state.deleteOnFail = e.target.checked; save(); });
  // not saved: pushing must be chosen again after every page load
  $('pushNew').addEventListener('change', renderSelected);
  $('hideArchived').addEventListener('change', (e) => { state.hideArchived = e.target.checked; save(); renderBranches(); });
  $('filter').addEventListener('input', renderBranches);
  $('base').addEventListener('change', (e) => {
    state.base = e.target.value;
    state.selected = state.selected.filter((n) => n !== state.base);
    save();
    renderBranches();
    renderSelected();
  });
  $('forgetToken').addEventListener('click', () => { state.token = ''; branches = []; save(); renderAll(); });
  $('reload').addEventListener('click', reload);
  $('clearSel').addEventListener('click', () => { state.selected = []; save(); renderBranches(); renderSelected(); });
  $('renew').addEventListener('click', () => { $('newName').value = state.prefix + stamp(); });
  $('apply').addEventListener('click', apply);
  $('closeConflicts').addEventListener('click', () => { conflictHead = null; renderConflicts(); });
  // opening a file loads its conflicts (the toggle event), so Expand all loads them all
  const setConflictsOpen = (open) => { for (const d of $('conflictFiles').querySelectorAll('details')) d.open = open; };
  $('expandConflicts').addEventListener('click', () => setConflictsOpen(true));
  $('collapseConflicts').addEventListener('click', () => setConflictsOpen(false));
  $('clearHistory').addEventListener('click', () => { state.history = []; save(); renderHistory(); });

  $('newName').value = state.prefix + stamp();
  renderAll();
  (async () => {
    // first visit in local mode: start from the folder given to the helper with --repo
    if (HELPER && !state.localPath) {
      try {
        const { status, data } = await helper('/info');
        if (status === 200 && data?.repo) { state.localPath = data.repo; save(); renderAll(); }
      } catch { /* the folder can be entered by hand */ }
    }
    if (ready()) reload();
  })();
})();
</script>
</body>
</html>
